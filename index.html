<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Adventure: The Amazing Can Mystery!</title>
    
    <!-- Main CSS -->
    <link rel="stylesheet" href="styles/main.css">
    
    <!-- Screen-specific CSS will be loaded dynamically -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three@0.158.0/build/three.min.js"></script>
</head>
<body>
    <!-- Main container where screens will be loaded -->
    <div class="container">
        <!-- Loading message -->
        <div id="loadingScreen">
            <h1>🎯 Math Adventure Loading... 🎯</h1>
            <div style="text-align: center; margin: 20px;">
                <div style="width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
                <p style="margin-top: 20px; color: #666;">Preparing your math adventure...</p>
            </div>
        </div>
    </div>
    
    <!-- Bot Introduction Overlay -->
    <div class="bot-overlay" id="botOverlay"></div>
    
    <!-- AI Companion Bot -->
    <div class="ai-companion" id="aiCompanion">
        <div class="bot-avatar">
                            <img src="images/bot-design.png" alt="AI Companion Bot">
        </div>
        <div class="bot-status">Ready to help! 🤖</div>
    </div>

    <!-- Left Navigation Panel -->
    <div class="navigation-panel" id="navigationPanel">
        <div class="nav-header">
            <div class="nav-header-content">
                <div class="nav-title-row">
                    <h3>📚 Learning Journey</h3>
                    <button class="nav-toggle-btn" id="navToggleBtn" title="Collapse Navigation">
                        <span class="toggle-icon">◀</span>
                    </button>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
        <div class="nav-list" id="navList">
            <!-- Navigation items will be populated dynamically -->
        </div>
    </div>
    
    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <!-- Main JavaScript -->
    <script src="config/screenSequence.js"></script>
    <script src="config/screenTransitions.js"></script>
    <script src="scripts/botTransitionOverlay.js"></script>
    <script src="scripts/summaryBotTransition.js"></script>
    <script src="scripts/main.js"></script>
    <script src="scripts/solveTogetherPopup.js"></script>
    
    <!-- Screen-specific JavaScript will be loaded dynamically -->
    
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #loadingScreen {
            text-align: center;
            padding: 40px;
        }
    </style>
</body>
</html>
