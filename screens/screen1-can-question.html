<!-- Screen 1: Can Question Screen -->
<div class="screen" id="screen1">
    <h1>🎯 Math Adventure: The Amazing Can Mystery! 🎯</h1>
    
    <div class="can-container">
        <div class="can"></div>
    </div>
    
    <div class="question">
        <h2><img src="images/thinking-robot.png" alt="Thinking Robot" style="width: 40px; height: 40px; vertical-align: middle; margin-right: 10px;"> Intriguing Question!</h2>
        <p>If you peel the label off this spinning can and spread it flat, what shape and size of rectangle will you get?</p>
    </div>
    
    <div class="input-section">
        <div class="input-group">
            <input type="text" id="answerInput" placeholder="Type your answer here..." maxlength="100">
            <div class="mic-btn" id="micBtn" title="Click to speak">🎤</div>
            <button class="btn btn-primary" id="submitBtn">Submit Answer</button>
        </div>
        <button class="btn btn-secondary skip-btn" id="skipBtn">Skip for now</button>
    </div>
    
    <div class="feedback" id="feedback"></div>
    
    <div class="animation-container" id="animationContainer">
        <div class="rectangle" id="rectangle">
            Rectangle: 2πr × h
        </div>
    </div>
</div>
