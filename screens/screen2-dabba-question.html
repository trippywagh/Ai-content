<!-- Screen 2: Dabba Question Screen -->
<div class="screen" id="screen2">
    <h1>🎯 Math Adventure: The Amazing Coke Can Mystery! 🎯</h1>
    
    <div class="can-container">
        <div class="can">
            <div class="can-top"></div>
            <div class="can-bottom"></div>
            <div class="can-label">
                <div class="coke-logo"></div>
                <div class="can-design">
                    <div class="wave-pattern"></div>
                </div>
            </div>
            <div class="pull-tab"></div>
        </div>
    </div>
    
    <div class="question">
        <h2><img src="images/bot-design.png" alt="AI Companion Bot" style="width: 40px; height: 40px; vertical-align: middle; margin-right: 10px;"> Intriguing Question!</h2>
        <p>If you cut the Coke can open from top to bottom and spread it out, what shape will it be?</p>
    </div>
    
    <!-- Voice Mode Toggle -->
    <div class="voice-mode-section">
        <div class="voice-toggle" id="voiceToggle">
            <span class="toggle-label">🎤 Voice Mode</span>
            <div class="toggle-switch">
                <input type="checkbox" id="voiceModeCheckbox">
                <label for="voiceModeCheckbox" class="toggle-slider"></label>
            </div>
        </div>
        <div class="voice-status" id="voiceStatus" style="display: none;">
            <span class="microphone-icon">🎤</span>
            <span class="status-text">Listening...</span>
        </div>
    </div>
    
    <div class="options-section">
        <div class="option" data-answer="square">
            <div class="option-letter">A</div>
            <div class="option-text">A square</div>
        </div>
        <div class="option" data-answer="rectangle">
            <div class="option-letter">B</div>
            <div class="option-text">A rectangle</div>
        </div>
        <div class="option" data-answer="circle">
            <div class="option-letter">C</div>
            <div class="option-text">A circle</div>
        </div>
        <div class="option" data-answer="something-else">
            <div class="option-letter">D</div>
            <div class="option-text">Something else</div>
        </div>
    </div>
    
    <div class="feedback" id="feedback"></div>
    
    <div class="animation-container" id="animationContainer">
        <div class="rectangle" id="rectangle">
            Rectangle: 2πr × h
        </div>
    </div>
</div>
